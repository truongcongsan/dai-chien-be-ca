<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
  <radialGradient id="iris" cx="0.45" cy="0.4" r="0.65">
    <stop offset="0" stop-color="#4A2C1E"/><stop offset="0.7" stop-color="#1E110B"/><stop offset="1" stop-color="#0E0805"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="soft16" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter></defs>
  <defs>
    <radialGradient id="shell" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFE7D2"/><stop offset="0.45" stop-color="#FFC79C"/>
      <stop offset="0.85" stop-color="#FFA266"/><stop offset="1" stop-color="#F08848"/>
    </radialGradient>
    <clipPath id="eggClip"><circle cx="512" cy="512" r="330"/></clipPath>
  </defs>
  <g id="art">
    <circle cx="512" cy="512" r="330" fill="url(#shell)" opacity="0.93"/>
    <g clip-path="url(#eggClip)">
      
      <!-- mầm cá cuộn tròn: thân cong ôm quanh, đầu tròn có mắt -->
      <g opacity="0.6">
        <path d="M560 520 C540 620 420 650 375 570" stroke="#FF7A2E" stroke-width="74" fill="none" stroke-linecap="round" filter="url(#soft4)"/>
        <path d="M375 570 C350 520 360 470 395 445" stroke="#FF7A2E" stroke-width="44" fill="none" stroke-linecap="round" filter="url(#soft4)"/>
        <path d="M395 445 C405 420 430 405 440 400" stroke="#FF7A2E" stroke-width="22" fill="none" stroke-linecap="round" filter="url(#soft4)"/>
        <circle cx="590" cy="470" r="82" fill="#FF7A2E" filter="url(#soft4)"/>
      </g>
      <circle cx="610" cy="455" r="34" fill="#2A160C" opacity="0.85"/>
      <circle cx="621" cy="445" r="11" fill="#fff" opacity="0.9"/>
      <!-- bóng tối phía dưới cho khối -->
      <ellipse cx="560" cy="790" rx="320" ry="140" fill="#F08848" opacity="0.35" filter="url(#soft16)"/>
    </g>
    <circle cx="512" cy="512" r="326" fill="none" stroke="#E87A3A" stroke-width="8" opacity="0.45"/>
    <!-- phản sáng gel -->
    <path d="M300 330 C340 250 420 210 500 205" stroke="#fff" stroke-width="34" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#soft4)"/>
    <ellipse cx="300" cy="420" rx="22" ry="30" fill="#fff" opacity="0.7"/>
    <ellipse cx="700" cy="760" rx="90" ry="26" transform="rotate(-30 700 760)" fill="#fff" opacity="0.25" filter="url(#soft4)"/>
    
  </g></svg>